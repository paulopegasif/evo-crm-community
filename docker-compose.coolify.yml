## ============================================================================
## Evo CRM — stack de produção para Coolify (build a partir do código-fonte)
##
## Diferente do docker-compose.yml (dev: RAILS_ENV=development, bind mount do
## código, portas no host), este arquivo:
##   * builda auth / crm / frontend / processor / bot-runtime / flow / gateway
##     a partir dos submódulos (inclui o white-label do cliente);
##   * roda os serviços Rails em RAILS_ENV=production;
##   * não publica portas no host — o proxy do Coolify roteia por domínio.
##
## Domínios (configurar no Coolify, aba de cada serviço):
##   evo-frontend → https://<FRONTEND_DOMAIN>          (porta 80)
##   evo-gateway  → https://<API_DOMAIN>               (porta 3030)
##   evo-flow     → https://<FLOW_DOMAIN>              (porta 3334)
##   n8n          → https://<N8N_DOMAIN>               (porta 5678)
##   evo-go-gateway: sem domínio público (o CRM usa a rede interna e o
##                   frontend faz proxy em /evo-go/)
##
## Todas as variáveis ${...} vêm das Environment Variables do Coolify.
## Primeiro deploy: depois que tudo subir, rode o seed do auth
##   (evo-auth → Terminal → `bundle exec rails db:seed`) e crie o admin em
##   https://<FRONTEND_DOMAIN>/setup.
## ============================================================================

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    oom_score_adj: -800
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-evo_community}
      POSTGRES_USER: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:alpine
    restart: unless-stopped
    oom_score_adj: -500
    command: ["sh", "-c", "redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    oom_score_adj: 300
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: evoflow
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "5672"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    restart: unless-stopped
    oom_score_adj: 500
    mem_limit: 1g
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: default
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    entrypoint:
      - sh
      - -c
      - |
        cat > /etc/clickhouse-server/config.d/low-resources.xml <<'XML'
        <clickhouse>
          <max_server_memory_usage_to_ram_ratio>0.75</max_server_memory_usage_to_ram_ratio>
          <mark_cache_size>268435456</mark_cache_size>
          <index_mark_cache_size>67108864</index_mark_cache_size>
          <uncompressed_cache_size>16777216</uncompressed_cache_size>
          <query_log remove="1"/>
          <query_thread_log remove="1"/>
          <query_views_log remove="1"/>
          <part_log remove="1"/>
          <trace_log remove="1"/>
          <text_log remove="1"/>
          <metric_log remove="1"/>
          <latency_log remove="1"/>
          <error_log remove="1"/>
          <asynchronous_metric_log remove="1"/>
          <processors_profile_log remove="1"/>
          <opentelemetry_span_log remove="1"/>
          <session_log remove="1"/>
          <blob_storage_log remove="1"/>
          <background_schedule_pool_log remove="1"/>
        </clickhouse>
        XML
        exec /entrypoint.sh
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # API Gateway (nginx) — único domínio público das APIs
  # ---------------------------------------------------------------------------
  evo-gateway:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    oom_score_adj: -500
    expose:
      - "3030"
    environment:
      AUTH_UPSTREAM: evo-auth:3001
      CRM_UPSTREAM: evo-crm:3000
      CORE_UPSTREAM: evo-core:5555
      PROCESSOR_UPSTREAM: evo-processor:8000
      BOT_RUNTIME_UPSTREAM: evo-bot-runtime:8080
    depends_on:
      - evo-auth
      - evo-crm

  # ---------------------------------------------------------------------------
  # Auth Service (Ruby / Rails) — Port 3001
  # ---------------------------------------------------------------------------
  evo-auth:
    image: inove-evo-auth:production
    build:
      context: ./evo-auth-service-community
      dockerfile: Dockerfile
      args:
        RAILS_ENV: production
    restart: unless-stopped
    oom_score_adj: -300
    environment:
      RAILS_ENV: production
      RAILS_MAX_THREADS: "5"
      RAILS_LOG_TO_STDOUT: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      EVOAI_CRM_API_TOKEN: ${EVOAI_CRM_API_TOKEN}
      DOORKEEPER_JWT_SECRET_KEY: ${DOORKEEPER_JWT_SECRET_KEY}
      DOORKEEPER_JWT_ALGORITHM: hs256
      DOORKEEPER_JWT_ISS: evo-auth-service
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-evo_community}
      POSTGRES_SSLMODE: disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      FRONTEND_URL: https://${FRONTEND_DOMAIN}
      BACKEND_URL: https://${API_DOMAIN}
      CORS_ORIGINS: https://${FRONTEND_DOMAIN},https://${API_DOMAIN}
      MFA_ISSUER: ${MFA_ISSUER:-INOVE CRM}
      SIDEKIQ_CONCURRENCY: "10"
      OAUTH_TOKEN_EXPIRES_IN: "28800"
      ACTIVE_STORAGE_SERVICE: local
      ACTIVE_STORAGE_URL: https://${API_DOMAIN}
      SMTP_DOMAIN: ${SMTP_DOMAIN:-}
      MAILER_SENDER_EMAIL: ${MAILER_SENDER_EMAIL:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_AUTHENTICATION: plain
      SMTP_ENABLE_STARTTLS_AUTO: "true"
      # White-label (seed/boot sobrescreve installation configs)
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-INOVE Centro Educacional}
      ORGANIZATION_DOMAIN: ${FRONTEND_DOMAIN}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-pt-BR}
    volumes:
      - auth_storage:/rails/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  evo-auth-sidekiq:
    image: inove-evo-auth:production
    build:
      context: ./evo-auth-service-community
      dockerfile: Dockerfile
      args:
        RAILS_ENV: production
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      RUN_MIGRATIONS: "false"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      EVOAI_CRM_API_TOKEN: ${EVOAI_CRM_API_TOKEN}
      DOORKEEPER_JWT_SECRET_KEY: ${DOORKEEPER_JWT_SECRET_KEY}
      DOORKEEPER_JWT_ALGORITHM: hs256
      DOORKEEPER_JWT_ISS: evo-auth-service
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-evo_community}
      POSTGRES_SSLMODE: disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      FRONTEND_URL: https://${FRONTEND_DOMAIN}
      BACKEND_URL: https://${API_DOMAIN}
      SIDEKIQ_CONCURRENCY: "10"
      ACTIVE_STORAGE_SERVICE: local
      SMTP_DOMAIN: ${SMTP_DOMAIN:-}
      MAILER_SENDER_EMAIL: ${MAILER_SENDER_EMAIL:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_AUTHENTICATION: plain
      SMTP_ENABLE_STARTTLS_AUTO: "true"
    volumes:
      - auth_storage:/rails/storage
    depends_on:
      evo-auth:
        condition: service_healthy
    healthcheck:
      disable: true
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  # ---------------------------------------------------------------------------
  # CRM Service (Ruby / Rails) — Port 3000
  # ---------------------------------------------------------------------------
  evo-crm:
    image: inove-evo-crm:production
    build:
      context: ./evo-ai-crm-community
      dockerfile: docker/Dockerfile
      args:
        RAILS_ENV: production
    restart: unless-stopped
    oom_score_adj: -500
    environment:
      RAILS_ENV: production
      RAILS_SERVE_STATIC_FILES: "true"
      RAILS_LOG_TO_STDOUT: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      EVOAI_CRM_API_TOKEN: ${EVOAI_CRM_API_TOKEN}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-evo_community}
      POSTGRES_SSLMODE: disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      EVO_AUTH_SERVICE_URL: http://evo-auth:3001
      EVO_AI_CORE_SERVICE_URL: http://evo-core:5555
      EVO_FLOW_ENABLED: "true"
      EVO_FLOW_API_URL: http://evo-flow:3334/api/v1
      EVO_FLOW_ALLOW_INSECURE: "true"
      AUTH_APIKEY_INTEGRATION_LOCAL: ${AUTH_APIKEY_INTEGRATION_LOCAL}
      BACKEND_URL: https://${API_DOMAIN}
      FRONTEND_URL: https://${FRONTEND_DOMAIN}
      CORS_ORIGINS: https://${FRONTEND_DOMAIN},https://${API_DOMAIN}
      DISABLE_TELEMETRY: "true"
      LOG_LEVEL: info
      ENABLE_ACCOUNT_SIGNUP: ${ENABLE_ACCOUNT_SIGNUP:-false}
      ENABLE_PUSH_RELAY_SERVER: "true"
      ENABLE_INBOX_EVENTS: "true"
      BOT_RUNTIME_URL: http://evo-bot-runtime:8080
      BOT_RUNTIME_SECRET: ${BOT_RUNTIME_SECRET}
      BOT_RUNTIME_POSTBACK_BASE_URL: http://evo-crm:3000
      # Evolution Go (canal WhatsApp via QR Code) — URL interna + token admin global
      EVOLUTION_GO_API_URL: http://evo-go-gateway:8080
      EVOLUTION_GO_ADMIN_SECRET: ${EVOLUTION_GO_API_KEY}
      ACTIVE_STORAGE_SERVICE: local
      ACTIVE_STORAGE_URL: https://${API_DOMAIN}
      SMTP_DOMAIN: ${SMTP_DOMAIN:-}
      MAILER_SENDER_EMAIL: ${MAILER_SENDER_EMAIL:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_AUTHENTICATION: plain
      SMTP_ENABLE_STARTTLS_AUTO: "true"
      # White-label (seed/boot sobrescreve installation configs)
      ORGANIZATION_NAME: ${ORGANIZATION_NAME:-INOVE Centro Educacional}
      ORGANIZATION_DOMAIN: ${FRONTEND_DOMAIN}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-pt-BR}
      INSTALLATION_NAME: ${INSTALLATION_NAME:-INOVE CRM}
      BRAND_NAME: ${BRAND_NAME:-INOVE CRM}
    volumes:
      - crm_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evo-auth:
        condition: service_healthy
    healthcheck:
      # A imagem de produção do CRM (Alpine) não tem curl — usar o wget do busybox.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  evo-crm-sidekiq:
    image: inove-evo-crm:production
    build:
      context: ./evo-ai-crm-community
      dockerfile: docker/Dockerfile
      args:
        RAILS_ENV: production
    restart: unless-stopped
    environment:
      RAILS_ENV: production
      RUN_MIGRATIONS: "false"
      RAILS_LOG_TO_STDOUT: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      EVOAI_CRM_API_TOKEN: ${EVOAI_CRM_API_TOKEN}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-evo_community}
      POSTGRES_SSLMODE: disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      EVO_AUTH_SERVICE_URL: http://evo-auth:3001
      EVO_AI_CORE_SERVICE_URL: http://evo-core:5555
      EVO_FLOW_ENABLED: "true"
      EVO_FLOW_API_URL: http://evo-flow:3334/api/v1
      EVO_FLOW_ALLOW_INSECURE: "true"
      AUTH_APIKEY_INTEGRATION_LOCAL: ${AUTH_APIKEY_INTEGRATION_LOCAL}
      BACKEND_URL: https://${API_DOMAIN}
      FRONTEND_URL: https://${FRONTEND_DOMAIN}
      DISABLE_TELEMETRY: "true"
      LOG_LEVEL: info
      BOT_RUNTIME_URL: http://evo-bot-runtime:8080
      BOT_RUNTIME_SECRET: ${BOT_RUNTIME_SECRET}
      BOT_RUNTIME_POSTBACK_BASE_URL: http://evo-crm:3000
      # Evolution Go (canal WhatsApp via QR Code) — URL interna + token admin global
      EVOLUTION_GO_API_URL: http://evo-go-gateway:8080
      EVOLUTION_GO_ADMIN_SECRET: ${EVOLUTION_GO_API_KEY}
      ACTIVE_STORAGE_SERVICE: local
      ACTIVE_STORAGE_URL: https://${API_DOMAIN}
      SMTP_DOMAIN: ${SMTP_DOMAIN:-}
      MAILER_SENDER_EMAIL: ${MAILER_SENDER_EMAIL:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_AUTHENTICATION: plain
      SMTP_ENABLE_STARTTLS_AUTO: "true"
    volumes:
      - crm_storage:/app/storage
    depends_on:
      evo-crm:
        condition: service_healthy
    healthcheck:
      disable: true
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  # ---------------------------------------------------------------------------
  # Core Service (Go / Gin) — Port 5555 (imagem pública, sem customização)
  # ---------------------------------------------------------------------------
  evo-core:
    image: evoapicloud/evo-ai-core-service-community:latest
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USERNAME:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DATABASE:-evo_community}
      DB_SSLMODE: disable
      DB_MAX_IDLE_CONNS: "10"
      DB_MAX_OPEN_CONNS: "100"
      DB_CONN_MAX_LIFETIME: 1h
      DB_CONN_MAX_IDLE_TIME: 30m
      PORT: "5555"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      EVOLUTION_BASE_URL: http://evo-crm:3000
      EVO_AUTH_BASE_URL: http://evo-auth:3001
      AI_PROCESSOR_URL: http://evo-processor:8000
      AI_PROCESSOR_VERSION: v1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5555/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Processor Service (Python / FastAPI) — Port 8000
  # ---------------------------------------------------------------------------
  evo-processor:
    build:
      context: ./evo-ai-processor-community
      dockerfile: Dockerfile
    restart: unless-stopped
    # O schema master do CRM (db:prepare) recria `alembic_version` vazia. Se as
    # tabelas do processor já existem, o upgrade falha com DuplicateTable — nesse
    # caso marcamos a revisão atual (stamp) em vez de entrar em crash loop.
    command:
      - sh
      - -c
      - |
        alembic upgrade head || { echo "[init] alembic upgrade failed — stamping head"; alembic stamp head; }
        python -m scripts.run_seeders || echo "[init] seeders failed (continuing)"
        exec uvicorn src.main:app --host "$$HOST" --port "$$PORT"
    environment:
      POSTGRES_CONNECTION_STRING: postgresql://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE:-evo_community}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_SSL: "false"
      REDIS_DB: "1"
      REDIS_KEY_PREFIX: a2a_
      REDIS_TTL: "3600"
      HOST: 0.0.0.0
      PORT: "8000"
      DEBUG: "false"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      EVOAI_CRM_API_TOKEN: ${EVOAI_CRM_API_TOKEN}
      EVO_AUTH_BASE_URL: http://evo-auth:3001
      EVO_AI_CRM_URL: http://evo-crm:3000
      CORE_SERVICE_URL: http://evo-core:5555/api/v1
      APP_URL: https://${API_DOMAIN}
      API_URL: https://${API_DOMAIN}
      TOOLS_CACHE_ENABLED: "true"
      TOOLS_CACHE_TTL: "3600"
    volumes:
      - processor_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evo-auth:
        condition: service_healthy
      # Espera o schema master do CRM ser carregado antes de rodar o alembic.
      evo-crm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Bot Runtime (Go / Gin) — Port 8080
  # ---------------------------------------------------------------------------
  evo-bot-runtime:
    build:
      context: ./evo-bot-runtime
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      AI_PROCESSOR_URL: http://evo-processor:8000
      BOT_RUNTIME_SECRET: ${BOT_RUNTIME_SECRET}
      AI_CALL_TIMEOUT_SECONDS: "30"
    depends_on:
      redis:
        condition: service_healthy
      evo-processor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # EvoFlow (NestJS — journeys/campaigns) — Port 3334
  # ---------------------------------------------------------------------------
  evo-flow:
    build:
      context: ./evo-flow-community
      dockerfile: Dockerfile
    restart: unless-stopped
    oom_score_adj: 300
    expose:
      - "3334"
    command:
      - sh
      - -c
      - |
        node -e 'const h=require("http");const t=()=>h.get("http://"+process.env.CLICKHOUSE_HOST+":"+process.env.CLICKHOUSE_PORT+"/ping",r=>{r.resume();r.statusCode===200?process.exit(0):setTimeout(t,15000)}).on("error",()=>{console.log("[init] waiting for clickhouse");setTimeout(t,15000)});t();'
        node -e 'const{Client}=require("pg");const db=process.env.POSTGRES_DB_DATABASE;const c=new Client({host:process.env.POSTGRES_DB_HOST,port:+(process.env.POSTGRES_DB_PORT||5432),user:process.env.POSTGRES_DB_USERNAME,password:process.env.POSTGRES_DB_PASSWORD,database:"postgres"});c.connect().then(()=>c.query("CREATE DATABASE "+db)).then(()=>console.log("[init] created "+db)).catch(e=>console.log("[init] "+(e.code==="42P04"?"db already exists":e.message))).finally(()=>c.end());'
        node_modules/.bin/typeorm migration:run -d dist/database/ormconfig.js || echo "[init] migration:run failed (continuing)"
        exec node dist/main.js
    environment:
      NODE_ENV: production
      RUN_MODE: api
      QUEUE_MODE: direct
      STORAGE_MODE: clickhouse
      WRITE_MODE: ch-sync
      PORT: "3334"
      LOG_LEVEL: log
      BROKER_TYPE: rabbitmq
      RABBITMQ_URL: amqp://evoflow:${RABBITMQ_PASSWORD}@rabbitmq:5672
      AUTH_APIKEY_INTEGRATION_LOCAL: ${AUTH_APIKEY_INTEGRATION_LOCAL}
      EVO_AUTH_SERVICE_URL: http://evo-auth:3001
      EVO_AUTH_VALIDATE_TOKEN_ENDPOINT: /api/v1/auth/validate
      EVOAI_CRM_BASE_URL: http://evo-crm:3000
      EVOAI_CRM_API_TOKEN: ${EVOAI_CRM_API_TOKEN}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: evo_campaign
      CLICKHOUSE_USERNAME: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_TABLE: contact_events
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "4"
      POSTGRES_DB_HOST: postgres
      POSTGRES_DB_PORT: "5432"
      POSTGRES_DB_USERNAME: ${POSTGRES_USERNAME:-postgres}
      POSTGRES_DB_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB_DATABASE: evo_campaign
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend (React / Vite / Nginx) — Port 80
  # ---------------------------------------------------------------------------
  evo-frontend:
    build:
      context: ./evo-ai-frontend-community
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    environment:
      VITE_APP_ENV: production
      VITE_API_URL: https://${API_DOMAIN}
      VITE_AUTH_API_URL: https://${API_DOMAIN}
      VITE_WS_URL: https://${API_DOMAIN}
      VITE_EVOAI_API_URL: https://${API_DOMAIN}
      VITE_AGENT_PROCESSOR_URL: https://${API_DOMAIN}
      VITE_EVOFLOW_API_URL: https://${FLOW_DOMAIN}
    depends_on:
      - evo-gateway
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # db-init — cria os bancos extras (Evolution Go, n8n) no postgres da stack
  # ---------------------------------------------------------------------------
  db-init:
    image: pgvector/pgvector:pg16
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USERNAME:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command:
      - sh
      - -c
      - |
        for db in evogo_auth evogo_users n8n; do
          psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$db'" | grep -q 1 \
            || psql -d postgres -c "CREATE DATABASE $$db" && echo "[db-init] $$db ok"
        done
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Evolution Go (WhatsApp via QR Code) — Port 8080, só na rede interna
  # O nome do serviço precisa ser evo-go-gateway: é o host usado pelo CRM e
  # pelo proxy /evo-go/ do nginx do frontend.
  # ---------------------------------------------------------------------------
  evo-go-gateway:
    build:
      context: ./evolution-go
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SERVER_PORT: "8080"
      CLIENT_NAME: ${EVOLUTION_GO_CLIENT_NAME:-inove}
      GLOBAL_API_KEY: ${EVOLUTION_GO_API_KEY}
      POSTGRES_AUTH_DB: postgresql://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://${POSTGRES_USERNAME:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "false"
      AMQP_URL: amqp://evoflow:${RABBITMQ_PASSWORD}@rabbitmq:5672
      AMQP_GLOBAL_ENABLED: "false"
      WADEBUG: INFO
      LOGTYPE: console
      WEBHOOK_FILES: "true"
      CONNECT_ON_STARTUP: "true"
      OS_NAME: ${BRAND_NAME:-INOVE CRM}
      MINIO_ENABLED: "false"
    depends_on:
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/server/ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # n8n — automações e ferramentas dos agentes (Hotmart etc.) — Port 5678
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    expose:
      - "5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USERNAME:-postgres}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_DOMAIN}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: "1"
      WEBHOOK_URL: https://${N8N_DOMAIN}/
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN}/
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  clickhouse_data:
  auth_storage:
  crm_storage:
  processor_logs:
  n8n_data:
